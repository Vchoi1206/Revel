<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요한계시록 개역한글 암송 프로그램</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.9; padding: 20px; max-width: 900px; margin: 0 auto; background-color: #f4f6f9; color: #333; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        
        /* 대시보드 스타일 */
        .dashboard { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 5px solid #2ecc71; }
        .dashboard h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 16px; }
        .score-container { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
        .score-badge { background: #edf2f7; padding: 4px 8px; border-radius: 6px; color: #4a5568; font-weight: bold; }
        .score-badge.completed { background: #e8f8f5; color: #27ae60; border: 1px solid #2ecc71; }

        .control-panel { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; position: sticky; top: 0; z-index: 100; }
        select, button { padding: 12px 18px; font-size: 16px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; transition: all 0.2s; }
        select { background-color: #fff; font-weight: bold; color: #2c3e50; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; }
        button:hover { background-color: #2980b9; transform: translateY(-1px); }
        
        .btn-75 { background-color: #e67e22; }
        .btn-75:hover { background-color: #d35400; }
        .btn-85 { background-color: #e74c3c; }
        .btn-85:hover { background-color: #c0392b; }
        .btn-grade { background-color: #2ecc71; }
        .btn-grade:hover { background-color: #27ae60; }
        .btn-reset { background-color: #7f8c8d; }
        .btn-reset:hover { background-color: #95a5a6; }
        .btn-clear { background-color: #e2e8f0; color: #4a5568; font-size: 12px; padding: 6px 12px; margin-left: auto; border: 1px solid #cbd5e1; }
        .btn-clear:hover { background-color: #cbd5e1; }

        .bible-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); min-height: 300px; }
        .verse { margin-bottom: 18px; font-size: 18px; text-align: justify; word-break: keep-all; }
        .verse-num { font-weight: bold; color: #34495e; background: #eaecee; padding: 2px 6px; border-radius: 4px; margin-right: 8px; font-size: 14px; vertical-align: middle; }
        
        /* 빈칸 입력창 디자인 */
        .blank-input { border: none; border-bottom: 2px solid #7f8c8d; background-color: #f1f5f9; padding: 2px 4px; margin: 0 3px; font-size: 17px; font-family: inherit; text-align: center; border-radius: 4px; color: #2c3e50; transition: all 0.2s; }
        .blank-input:focus { outline: none; background-color: #fff; border-bottom-color: #3498db; box-shadow: 0 2px 4px rgba(52,152,219,0.2); }
        
        /* 채점결과 디자인 */
        .blank-input.correct { background-color: #e8f8f5 !important; border-bottom: 2px solid #2ecc71 !important; color: #27ae60 !important; font-weight: bold; }
        .blank-input.wrong { background-color: #fde8e8 !important; border-bottom: 2px solid #e74c3c !important; color: #e74c3c !important; font-weight: bold; }
        .wrong-ans { color: #e74c3c; font-size: 14px; font-weight: bold; margin-left: 2px; margin-right: 5px; }

        .hint-text { text-align: center; color: #7f8c8d; font-size: 14px; margin-top: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>📖 요한계시록 주관식 암송연습 (개역한글)</h1>
    
    <div class="dashboard">
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">📊 장별 최근 정답률 기록</h3>
            <button class="btn-clear" onclick="clearScores()">기록 전체 초기화</button>
        </div>
        <div class="score-container" id="dashboardScores">
            </div>
    </div>

    <div class="control-panel">
        <select id="chapterSelect" onchange="loadVerse()">
            <script>
                for(let i=1; i<=22; i++) {
                    document.write(`<option value="${i}">요한계시록 ${i}장</option>`);
                }
            </script>
        </select>
        <button class="btn-reset" onclick="loadVerse()">원문 보기</button>
        <button class="btn-75" onclick="transformText(0.75)">75% 빈칸</button>
        <button class="btn-85" onclick="transformText(0.85)">85% 빈칸</button>
        <button class="btn-grade" id="gradeBtn" onclick="gradeBlanks()" style="display:none;">채점하기</button>
    </div>

    <p class="hint-text">💡 빈칸 입력창을 터치/클릭하면 정답이 투명하게 힌트로 살짝 나타납니다.</p>
